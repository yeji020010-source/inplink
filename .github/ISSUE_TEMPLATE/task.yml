name: 작업
description: 새로 만들거나 고칠 작업
labels: ["task"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [랜딩 - Hero, 랜딩 - 진행 방식, 랜딩 - 장점, 랜딩 - 샘플 게시물, 랜딩 - 신청 폼, 랜딩 - FAQ, 프로토타입(/app), 공통/기타]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 할 일
      description: 무엇을, 왜 바꾸는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 완료 기준
      placeholder: 예) 모바일에서 CTA 버튼 두 개가 한 줄에 보인다
